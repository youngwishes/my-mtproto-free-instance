services:
  telemt:
    image: ghcr.io/telemt/telemt:3.4.22
    container_name: telemt
    restart: unless-stopped
    user: "root"
    working_dir: /run/telemt
    environment:
      RUST_LOG: "info"
    command: /usr/local/bin/telemt /etc/telemt/telemt.toml
    volumes:
      - ./telemt:/etc/telemt:rw
    security_opt:
      - no-new-privileges:true
    ports:
      - "443:443/tcp"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /run/telemt:rw,mode=1777,size=4m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
