---
- name: Install Telemt GeoIP dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ipset
      - python3
      - python3-venv
    state: present
    update_cache: true

- name: Check Docker forwarding chain for GeoIP allowlist
  ansible.builtin.command: iptables -w -nL DOCKER-USER
  register: telemt_geo_docker_user
  changed_when: false
  failed_when: false

- name: Require Docker forwarding chain for GeoIP allowlist
  ansible.builtin.assert:
    that:
      - telemt_geo_docker_user.rc == 0
    fail_msg: DOCKER-USER is unavailable; refusing to install the GeoIP allowlist

- name: Create Telemt GeoIP state directory
  ansible.builtin.file:
    path: "{{ telemt_geo_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Telemt GeoIP extractor
  ansible.builtin.copy:
    src: telemt-geo-extract
    dest: /usr/local/sbin/telemt-geo-extract
    owner: root
    group: root
    mode: "0755"
  register: telemt_geo_extractor

- name: Install Telemt GeoIP firewall manager
  ansible.builtin.copy:
    src: telemt-geo-allow
    dest: /usr/local/sbin/telemt-geo-allow
    owner: root
    group: root
    mode: "0755"
  register: telemt_geo_manager

- name: Install Telemt GeoIP systemd unit
  ansible.builtin.template:
    src: telemt-geo-allow.service.j2
    dest: /etc/systemd/system/telemt-geo-allow.service
    owner: root
    group: root
    mode: "0644"
  register: telemt_geo_unit

- name: Reload systemd units for Telemt GeoIP
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: telemt_geo_unit.changed

- name: Check current Telemt GeoIP allowlist
  ansible.builtin.command: /usr/local/sbin/telemt-geo-allow check
  environment:
    TELEMT_GEO_INTERFACE: '{{ ansible_facts["default_ipv4"]["interface"] }}'
    TELEMT_GEO_PORT: "{{ telemt_geo_port }}"
    TELEMT_GEO_SET: "{{ telemt_geo_set_name }}"
    TELEMT_GEO_CIDR_FILE: "{{ telemt_geo_cidr_file }}"
    TELEMT_GEO_MIN_NETWORKS: "{{ telemt_geo_min_networks }}"
  register: telemt_geo_current
  changed_when: false
  failed_when: false

- name: Enable fail-closed Telemt GeoIP allowlist
  ansible.builtin.systemd_service:
    name: telemt-geo-allow.service
    enabled: true
    state: "{{ 'restarted' if telemt_geo_extractor.changed or telemt_geo_manager.changed or telemt_geo_unit.changed or telemt_geo_current.rc != 0 else 'started' }}"

- name: Install pinned MaxMind database reader
  ansible.builtin.pip:
    name: "maxminddb=={{ telemt_geo_maxminddb_version }}"
    virtualenv: /opt/telemt-geo-allow/venv
    virtualenv_command: /usr/bin/python3 -m venv

- name: Download GeoLite2 Country database
  ansible.builtin.get_url:
    url: "{{ telemt_geo_database_url }}"
    dest: "{{ telemt_geo_state_dir }}/GeoLite2-Country.mmdb.new"
    owner: root
    group: root
    mode: "0644"
    force: true
    timeout: 60

- name: Extract Russian IPv4 networks
  ansible.builtin.command:
    argv:
      - /opt/telemt-geo-allow/venv/bin/python
      - /usr/local/sbin/telemt-geo-extract
      - "{{ telemt_geo_state_dir }}/GeoLite2-Country.mmdb.new"
      - "{{ telemt_geo_cidr_file }}.new"
      - "{{ telemt_geo_country_code }}"
      - "{{ telemt_geo_min_networks | string }}"
  changed_when: true

- name: Load Russian IPv4 allowlist
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/telemt-geo-allow
      - load
      - "{{ telemt_geo_cidr_file }}.new"
  environment:
    TELEMT_GEO_SET: "{{ telemt_geo_set_name }}"
    TELEMT_GEO_MIN_NETWORKS: "{{ telemt_geo_min_networks }}"
  changed_when: true

- name: Cache validated Russian IPv4 networks
  ansible.builtin.command:
    argv:
      - mv
      - "-f"
      - "{{ telemt_geo_cidr_file }}.new"
      - "{{ telemt_geo_cidr_file }}"
  changed_when: true

- name: Remove downloaded GeoLite2 database
  ansible.builtin.file:
    path: "{{ telemt_geo_state_dir }}/GeoLite2-Country.mmdb.new"
    state: absent

- name: Verify Telemt GeoIP allowlist
  ansible.builtin.command: /usr/local/sbin/telemt-geo-allow check
  environment:
    TELEMT_GEO_INTERFACE: '{{ ansible_facts["default_ipv4"]["interface"] }}'
    TELEMT_GEO_PORT: "{{ telemt_geo_port }}"
    TELEMT_GEO_SET: "{{ telemt_geo_set_name }}"
    TELEMT_GEO_CIDR_FILE: "{{ telemt_geo_cidr_file }}"
    TELEMT_GEO_MIN_NETWORKS: "{{ telemt_geo_min_networks }}"
  changed_when: false
